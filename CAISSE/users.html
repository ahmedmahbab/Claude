<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المستخدمين – Al Nour Elite</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1E88E5; --secondary: #FFD700; --bg: #f4f7fa; --card-bg: #fff; --font-main: 'Tajawal', sans-serif; --radius: 8px; --spacing: 16px; --shadow: 0 4px 12px rgba(0,0,0,0.05); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-main); background: var(--bg); color: #333; }
    header { background: var(--primary); color: #fff; padding: var(--spacing); display: flex; align-items: center; justify-content: space-between; }
    .brand h1 { font-size: 1.5rem; margin: 0; }
    .container { max-width: 900px; margin: var(--spacing) auto; padding: 0 var(--spacing); }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--spacing); margin-bottom: var(--spacing); }
    h2 { margin-top: 0; color: var(--primary); }
    label { font-weight: 500; display: block; margin-bottom: 4px; }
    input, select, button { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: var(--radius); margin-bottom: var(--spacing); font-size: 0.9rem; }
    button { background: var(--secondary); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; }
    .row { display: flex; flex-wrap: wrap; gap: var(--spacing); }
    .col { flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; margin-top: var(--spacing); }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: var(--primary); color: #fff; }
    .alert { display: none; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-weight: bold; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-danger { background: #f8d7da; color: #721c24; }
    #mainContent { display: none; }
    .action-btn {
        font-size: 1.2rem;
        margin: 0 5px;
        border: none;
        background: none;
        cursor: pointer;
        transition: transform 0.2s;
        padding: 0;
    }
    .action-btn:hover {
        transform: scale(1.3);
    }
    /* Edit Modal Styles */
    #editUserModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
    #editUserModal .box { background: #fff; padding: 24px; border-radius: var(--radius); width: 90%; max-width: 500px; }
  </style>
</head>
<body>

  <!-- Edit User Modal -->
  <div id="editUserModal">
    <div class="box">
      <h2>تعديل بيانات المستخدم</h2>
      <form id="editUserForm">
        <input type="hidden" id="edit_user_id">
        <div class="row">
          <div class="col"><label>اسم المستخدم<input type="text" id="edit_username" required></label></div>
          <div class="col"><label>الاسم الكامل<input type="text" id="edit_full_name" required></label></div>
        </div>
        <div class="row">
          <div class="col"><label>كلمة مرور جديدة (اتركه فارغاً لعدم التغيير)<input type="password" id="edit_password"></label></div>
          <div class="col"><label>الصلاحية<select id="edit_role" required><option value="user">مستخدم</option><option value="admin">مدير</option></select></label></div>
        </div>
        <button type="submit">حفظ التغييرات</button>
        <button type="button" id="cancelEdit">إلغاء</button>
      </form>
    </div>
  </div>

  <header>
    <div class="brand">
      <h1>إدارة المستخدمين</h1>
    </div>
    <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">العودة للرئيسية</a>
  </header>

  <div id="mainContent" class="container">
    <div class="card">
      <h2>إضافة مستخدم جديد</h2>
      <div id="formAlert" class="alert"></div>
      <form id="addUserForm">
        <div class="row">
          <div class="col"><label>اسم المستخدم<input type="text" id="username" required></label></div>
          <div class="col"><label>الاسم الكامل<input type="text" id="full_name" required></label></div>
        </div>
        <div class="row">
          <div class="col"><label>كلمة المرور<input type="password" id="password" required></label></div>
          <div class="col"><label>الصلاحية<select id="role" required><option value="user" selected>مستخدم</option><option value="admin">مدير</option></select></label></div>
        </div>
        <button type="submit">إضافة المستخدم</button>
      </form>
    </div>

    <div class="card">
      <h2>قائمة المستخدمين</h2>
      <table id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>اسم المستخدم</th>
            <th>الاسم الكامل</th>
            <th>الصلاحية</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody>
          <!-- سيتم ملء البيانات هنا عبر JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', init);
    const apiUrl = 'api.php';
    let currentUser = null;

    function escapeHtml(value) {
      const str = String(value ?? '');
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return str.replace(/[&<>"']/g, (ch) => map[ch]);
    }

    async function apiCall(action, params = {}) {
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...params })
        });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error('API Call Error:', error);
        showAlert('حدث خطأ أثناء الاتصال بالخادم.', 'danger');
        return null;
      }
    }

    async function init() {
      const session = await apiCall('check_session');
      if (!(session && session.success && session.user.role === 'admin')) {
        document.body.innerHTML = '<h1 style="text-align:center; margin-top: 50px;">غير مصرح لك بالدخول لهذه الصفحة</h1>';
        return;
      }

      currentUser = session.user;
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('addUserForm').addEventListener('submit', handleAddUser);
      loadUsers();
    }

    async function loadUsers() {
      const result = await apiCall('get_users');
      const tableBody = document.querySelector('#usersTable tbody');
      tableBody.innerHTML = '';
      if (result && result.success) {
        result.users.forEach(user => {
          const username = escapeHtml(user.username);
          const fullName = escapeHtml(user.full_name);
          const role = escapeHtml(user.role);

          // Prevent admin from acting on themselves
          const isSelf = user.id == currentUser.id;
          let actions = 'لا يمكن التعديل';

          if (!isSelf) {
            const toggleIcon = user.is_active ? '🚫' : '✅';
            const toggleTitle = user.is_active ? 'تعطيل الحساب' : 'تفعيل الحساب';
            actions = `
              <button class="action-btn edit-user" data-id="${user.id}" title="تعديل">✏️</button>
              <button class="action-btn toggle-status" data-id="${user.id}" data-status="${user.is_active}" title="${toggleTitle}">${toggleIcon}</button>
              <button class="action-btn delete-user" data-id="${user.id}" title="حذف">🗑️</button>
            `;
          }

          const row = `
            <tr style="${!user.is_active ? 'background-color: #f8d7da;' : ''}">
              <td>${user.id}</td>
              <td>${username}</td>
              <td>${fullName}</td>
              <td>${role}</td>
              <td>${user.is_active ? 'نشط' : 'غير نشط'}</td>
              <td>${actions}</td>
            </tr>
          `;
          tableBody.insertAdjacentHTML('beforeend', row);
        });
        
        // Add event listeners after rendering
        addEventListenersToButtons();
      }
    }

    function addEventListenersToButtons() {
        const tableBody = document.querySelector('#usersTable tbody');
        
        // Remove old listeners to prevent duplicates
        tableBody.removeEventListener('click', handleTableClick);
        
        // Add a single listener to the table body
        tableBody.addEventListener('click', handleTableClick);
    }

    function handleTableClick(e) {
        const target = e.target.closest('.action-btn');
        if (!target) return;

        const id = target.dataset.id;
        if (target.classList.contains('delete-user')) {
            handleDeleteUser(id);
        } else if (target.classList.contains('toggle-status')) {
            handleToggleStatus(id, target.dataset.status);
        } else if (target.classList.contains('edit-user')) {
            handleShowEditModal(id);
        }
    }

    document.getElementById('cancelEdit').addEventListener('click', () => {
        document.getElementById('editUserModal').style.display = 'none';
    });

    document.getElementById('editUserForm').addEventListener('submit', handleUpdateUser);

    async function handleShowEditModal(id) {
        const result = await apiCall('get_user_details', { id });
        if (result && result.success) {
            const user = result.user;
            document.getElementById('edit_user_id').value = user.id;
            document.getElementById('edit_username').value = user.username;
            document.getElementById('edit_full_name').value = user.full_name;
            document.getElementById('edit_role').value = user.role;
            document.getElementById('edit_password').value = ''; // Clear password field
            document.getElementById('editUserModal').style.display = 'flex';
        } else {
            showAlert(result.message || 'فشل جلب بيانات المستخدم.', 'danger');
        }
    }

    async function handleUpdateUser(e) {
        e.preventDefault();
        const id = document.getElementById('edit_user_id').value;
        const username = document.getElementById('edit_username').value;
        const full_name = document.getElementById('edit_full_name').value;
        const role = document.getElementById('edit_role').value;
        const password = document.getElementById('edit_password').value; // Will be empty if not changed

        const result = await apiCall('update_user', { id, username, full_name, role, password });

        if (result && result.success) {
            document.getElementById('editUserModal').style.display = 'none';
            showAlert('تم تحديث المستخدم بنجاح!', 'success');
            loadUsers();
        } else {
            alert(result.message || 'فشل تحديث المستخدم.'); // Use alert for modal
        }
    }

    async function handleDeleteUser(id) {
        if (confirm(`هل أنت متأكد من حذف المستخدم رقم ${id}؟ لا يمكن التراجع عن هذا الإجراء.`)) {
            const result = await apiCall('delete_user', { id });
            if (result && result.success) {
                showAlert('تم حذف المستخدم بنجاح.', 'success');
                loadUsers();
            } else {
                showAlert(result.message || 'فشل حذف المستخدم.', 'danger');
            }
        }
    }

    async function handleToggleStatus(id, currentStatus) {
        const action = currentStatus == '1' ? 'تعطيل' : 'تفعيل';

        if (confirm(`هل أنت متأكد من ${action} حساب المستخدم رقم ${id}؟`)) {
            const result = await apiCall('toggle_user_status', { id });
            if (result && result.success) {
                showAlert('تم تحديث حالة المستخدم بنجاح.', 'success');
                loadUsers();
            } else {
                showAlert(result.message || 'فشل تحديث حالة المستخدم.', 'danger');
            }
        }
    }

    async function handleAddUser(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const full_name = document.getElementById('full_name').value;
      const role = document.getElementById('role').value;

      const result = await apiCall('add_user', { username, password, full_name, role });

      if (result && result.success) {
        showAlert('تمت إضافة المستخدم بنجاح!', 'success');
        document.getElementById('addUserForm').reset();
        loadUsers();
      } else {
        showAlert(result.message || 'فشل إضافة المستخدم.', 'danger');
      }
    }

    function showAlert(message, type = 'danger') {
        const alertBox = document.getElementById('formAlert');
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
