<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي – Al Nour Elite</title>
<link rel="icon" href="logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#333;font-family:Tajawal,sans-serif}
header{background:#1e88e5;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:16px}header a{color:white}h1{font-size:1.5rem;margin:0}
main{max-width:640px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:8px;padding:24px;margin-bottom:20px;box-shadow:0 4px 12px #0001}
h2{margin-top:0;color:#1e88e5}label{display:block;margin:16px 0 6px}input,button{font:inherit;border-radius:8px;padding:12px;width:100%}
input{border:1px solid #bbb}button{margin-top:20px;background:#ffd700;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.hint{color:#555;line-height:1.6;font-size:.95rem}.message{padding:12px;border-radius:8px;margin-top:12px;white-space:pre-line}.error{background:#f8d7da;color:#721c24}.success{background:#d4edda;color:#155724}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>حسابي</h1><a href="index.html">العودة للرئيسية</a></header>
<main>
<p id="loading" role="status">جارٍ تحميل بيانات الحساب…</p>
<div id="account" hidden>
<section class="card">
<h2>بيانات الحساب</h2>
<form id="profileForm">
<label for="fullName">الاسم الكامل</label><input id="fullName" name="full_name" autocomplete="name" maxlength="255" required>
<label for="accountUsername">اسم المستخدم</label><input id="accountUsername" name="username" autocomplete="username" maxlength="50" aria-describedby="usernameHint" required>
<p id="usernameHint" class="hint">يجب أن يحتوي اسم المستخدم على الاسم الأول أو اللقب الأخير كما كتبته في الاسم الكامل، دون مسافات. مثال: أحمد علي ← أحمد_25 أو علي25.</p>
<button type="submit">حفظ بيانات الحساب</button>
<div id="profileMessage" class="message" role="status" aria-live="polite" hidden></div>
</form>
</section>
<section class="card">
<h2>تغيير كلمة المرور</h2>
<form id="passwordForm">
<label for="currentPassword">كلمة المرور الحالية</label><input type="password" id="currentPassword" name="current_password" autocomplete="current-password" required>
<label for="newPassword">كلمة المرور الجديدة</label><input type="password" id="newPassword" name="new_password" autocomplete="new-password" minlength="8" required aria-describedby="passwordHint">
<p id="passwordHint" class="hint">8 أحرف على الأقل، وبحد أقصى 72 بايت (قد يشغل الحرف العربي أكثر من بايت).</p>
<label for="confirmPassword">تأكيد كلمة المرور الجديدة</label><input type="password" id="confirmPassword" name="confirm_password" autocomplete="new-password" required>
<button type="submit">تغيير كلمة المرور</button>
<div id="passwordMessage" class="message" role="status" aria-live="polite" hidden></div>
</form>
</section>
</div>
</main>
<script src="profile.js"></script>
</body>
</html>
